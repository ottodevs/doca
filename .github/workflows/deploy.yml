name: deploy
# Fallback CI path: builds the unified site and pushes it to Cloudflare Pages.
# Local `site/deploy.sh` (prebuilt push) is the primary, faster iteration path.
on:
  push:
    branches: [main]
    paths: [web/**, landing/**, deck/**, assets/**, docs/**, site/**]
  workflow_dispatch:

jobs:
  pages:
    runs-on: ubuntu-latest
    if: ${{ vars.PAGES_DEPLOY == 'on' }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd web && bun install --frozen-lockfile
      - run: bun site/build.mjs
      - run: bunx wrangler pages deploy site/dist --project-name doca
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
